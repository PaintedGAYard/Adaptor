syntax = "proto3";

option csharp_namespace = "Adaptor.Service";

package adaptor;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ═══════════════════════════════════════════════════════════════════════════
// Transaction 服务 — 事务生命周期管理
// ═══════════════════════════════════════════════════════════════════════════

service Transaction {
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);
  rpc GetTransactionStatus(GetTransactionStatusRequest) returns (GetTransactionStatusResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// DBRelational 服务 — 关系数据库通用操作
// ═══════════════════════════════════════════════════════════════════════════

service DBRelational {
  rpc Execute(RelationalExecuteRequest) returns (RelationalExecuteResponse);
  rpc Query(RelationalQueryRequest) returns (RelationalQueryResponse);
  rpc ExecuteBatch(RelationalExecuteBatchRequest) returns (RelationalExecuteBatchResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// DBRelationalVector 服务 — 关系数据库向量扩展搜索
// ═══════════════════════════════════════════════════════════════════════════

service DBRelationalVector {
  rpc Search(RelationalVectorSearchRequest) returns (VectorSearchResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// DBBLOB 服务 — BLOB 操作
// ═══════════════════════════════════════════════════════════════════════════

service DBBLOB {
  rpc BlobUpload(BlobUploadRequest) returns (BlobUploadResponse);
  rpc BlobDownload(BlobDownloadRequest) returns (BlobDownloadResponse);
  rpc BlobDelete(BlobDeleteRequest) returns (BlobDeleteResponse);
  rpc BlobList(BlobListRequest) returns (BlobListResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// 公共类型
// ═══════════════════════════════════════════════════════════════════════════

message TransactionContext {
  string transaction_id = 1;
}

message RelationalParameter {
  string name = 1;
  google.protobuf.Value value = 2;
}

message SparseVector {
  repeated int32 indices = 1;
  repeated float values = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// Transaction 服务消息
// ═══════════════════════════════════════════════════════════════════════════

message BeginTransactionRequest {
  google.protobuf.Duration timeout = 1;
  map<string, string> metadata = 2;
}

message BeginTransactionResponse {
  string transaction_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message CommitTransactionRequest {
  string transaction_id = 1;
}

message CommitTransactionResponse {
  CommitStatus status = 1;
  repeated DriverCommitResult driver_results = 2;
  string error_message = 3;
}

message RollbackTransactionRequest {
  string transaction_id = 1;
}

message RollbackTransactionResponse {
  bool success = 1;
  string error_message = 2;
}

message GetTransactionStatusRequest {
  string transaction_id = 1;
}

message GetTransactionStatusResponse {
  TransactionState state = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message DriverCommitResult {
  string driver_name = 1;
  bool success = 2;
  int32 retry_count = 3;
  string error_message = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// DBRelational 服务消息
// ═══════════════════════════════════════════════════════════════════════════

message RelationalExecuteRequest {
  TransactionContext transaction_context = 1;
  string command = 2;
  repeated RelationalParameter parameters = 3;
}

message RelationalExecuteResponse {
  int32 affected_rows = 1;
  double duration_ms = 2;
  string error_message = 3;
}

message RelationalQueryRequest {
  TransactionContext transaction_context = 1;
  string command = 2;
  repeated RelationalParameter parameters = 3;
}

message RelationalQueryResponse {
  repeated Row rows = 1;
  double duration_ms = 2;
  string error_message = 3;
}

message BatchCommand {
  string command = 1;
  repeated RelationalParameter parameters = 2;
}

message RelationalExecuteBatchRequest {
  TransactionContext transaction_context = 1;
  repeated BatchCommand commands = 2;
}

message RelationalExecuteBatchResponse {
  int32 total_affected_rows = 1;
  double duration_ms = 2;
  string error_message = 3;
}

message Row {
  map<string, google.protobuf.Value> columns = 1;
}

// ═══════════════════════════════════════════════════════════════════════════
// DBRelationalVector 服务消息
// ═══════════════════════════════════════════════════════════════════════════

message RelationalVectorSearchRequest {
  TransactionContext transaction_context = 1;
  string table = 2;
  string vector_column = 3;
  repeated float dense_vector = 4;
  SparseVector sparse_vector = 5;
  int32 top_k = 6;
  string where_clause = 7;
  repeated RelationalParameter parameters = 8;
}

message VectorSearchResponse {
  repeated VectorSearchHit hits = 1;
  double duration_ms = 2;
  string error_message = 3;
}

message VectorSearchHit {
  string id = 1;
  float score = 2;
  map<string, google.protobuf.Value> metadata = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// DBBLOB 服务消息
// ═══════════════════════════════════════════════════════════════════════════

message BlobUploadRequest {
  TransactionContext transaction_context = 1;
  string key = 2;
  bytes data = 3;
  string content_type = 4;
  map<string, string> metadata = 5;
}

message BlobUploadResponse {
  string key = 1;
  int64 size = 2;
  string error_message = 3;
}

message BlobDownloadRequest {
  TransactionContext transaction_context = 1;
  string key = 2;
}

message BlobDownloadResponse {
  string key = 1;
  bytes data = 2;
  string content_type = 3;
  string error_message = 4;
}

message BlobDeleteRequest {
  TransactionContext transaction_context = 1;
  string key = 2;
}

message BlobDeleteResponse {
  bool success = 1;
  string error_message = 2;
}

message BlobListRequest {
  TransactionContext transaction_context = 1;
  string prefix = 2;
}

message BlobListResponse {
  repeated string keys = 1;
  string error_message = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// 枚举定义
// ═══════════════════════════════════════════════════════════════════════════

enum CommitStatus {
  COMMIT_STATUS_UNSPECIFIED = 0;
  COMMIT_STATUS_COMMITTED = 1;
  COMMIT_STATUS_PARTIAL = 2;
  COMMIT_STATUS_ROLLED_BACK = 3;
  COMMIT_STATUS_TIMEOUT = 4;
}

enum TransactionState {
  TRANSACTION_STATE_UNSPECIFIED = 0;
  TRANSACTION_STATE_ACTIVE = 1;
  TRANSACTION_STATE_COMMITTED = 2;
  TRANSACTION_STATE_ROLLED_BACK = 3;
  TRANSACTION_STATE_IN_DOUBT = 4;
}
