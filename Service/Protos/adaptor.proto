syntax = "proto3";

option csharp_namespace = "Adaptor.Service";

package adaptor;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ═══════════════════════════════════════════════════════════════════════════
// Transaction 服务 — 事务生命周期管理
// ═══════════════════════════════════════════════════════════════════════════

service Transaction {
  // 开始一个新事务
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);
  // 提交事务（两阶段提交）
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  // 回滚事务
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);
  // 查询事务状态（映射自 System.Transactions.TransactionStatus）
  rpc GetTransactionStatus(GetTransactionStatusRequest) returns (GetTransactionStatusResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// DBSQL 服务 — SQL 操作
// ═══════════════════════════════════════════════════════════════════════════

service DBSQL {
  // 执行 SQL 命令（INSERT / UPDATE / DELETE / DDL）
  rpc SqlExecute(SqlExecuteRequest) returns (SqlExecuteResponse);
  // 执行 SQL 查询（SELECT）
  rpc SqlQuery(SqlQueryRequest) returns (SqlQueryResponse);
  // 批量执行 SQL 命令
  rpc SqlExecuteBatch(SqlExecuteBatchRequest) returns (SqlExecuteBatchResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// DBVector 服务 — 向量操作
// ═══════════════════════════════════════════════════════════════════════════

service DBVector {
  // 插入或更新向量
  rpc VectorUpsert(VectorUpsertRequest) returns (VectorUpsertResponse);
  // 向量相似度搜索
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);
  // 删除向量
  rpc VectorDelete(VectorDeleteRequest) returns (VectorDeleteResponse);
  // 列出所有集合
  rpc VectorListCollections(VectorListCollectionsRequest) returns (VectorListCollectionsResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// DBBLOB 服务 — BLOB 操作
// ═══════════════════════════════════════════════════════════════════════════

service DBBLOB {
  // 上传 BLOB
  rpc BlobUpload(BlobUploadRequest) returns (BlobUploadResponse);
  // 下载 BLOB
  rpc BlobDownload(BlobDownloadRequest) returns (BlobDownloadResponse);
  // 删除 BLOB
  rpc BlobDelete(BlobDeleteRequest) returns (BlobDeleteResponse);
  // 列出 BLOB
  rpc BlobList(BlobListRequest) returns (BlobListResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// 公共类型
// ═══════════════════════════════════════════════════════════════════════════

/// <summary>
/// 事务上下文 — 所有数据操作 RPC 必须包含此消息
/// </summary>
message TransactionContext {
  string transaction_id = 1;
}

/// <summary>
/// SQL 参数
/// </summary>
message SqlParameter {
  string name = 1;
  google.protobuf.Value value = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// Transaction 服务消息
// ═══════════════════════════════════════════════════════════════════════════

message BeginTransactionRequest {
  google.protobuf.Duration timeout = 1;     // 可选，事务超时时间
  map<string, string> metadata = 2;         // 可选，自定义元数据
}

message BeginTransactionResponse {
  string transaction_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message CommitTransactionRequest {
  string transaction_id = 1;
}

message CommitTransactionResponse {
  CommitStatus status = 1;
  repeated DriverCommitResult driver_results = 2;
  string error_message = 3;
}

message RollbackTransactionRequest {
  string transaction_id = 1;
}

message RollbackTransactionResponse {
  bool success = 1;
  string error_message = 2;
}

message GetTransactionStatusRequest {
  string transaction_id = 1;
}

message GetTransactionStatusResponse {
  TransactionState state = 1;
  google.protobuf.Timestamp expires_at = 2;
}

/// <summary>
/// 各 Driver 的提交结果记录
/// </summary>
message DriverCommitResult {
  string driver_name = 1;
  bool success = 2;
  int32 retry_count = 3;
  string error_message = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// DBSQL 服务消息
// ═══════════════════════════════════════════════════════════════════════════

message SqlExecuteRequest {
  TransactionContext transaction_context = 1;
  string command = 2;
  repeated SqlParameter parameters = 3;
}

message SqlExecuteResponse {
  int32 affected_rows = 1;
  double duration_ms = 2;
  string error_message = 3;
}

message SqlQueryRequest {
  TransactionContext transaction_context = 1;
  string command = 2;
  repeated SqlParameter parameters = 3;
}

message SqlQueryResponse {
  repeated Row rows = 1;
  double duration_ms = 2;
  string error_message = 3;
}

message SqlExecuteBatchRequest {
  TransactionContext transaction_context = 1;
  repeated string commands = 2;
}

message SqlExecuteBatchResponse {
  int32 total_affected_rows = 1;
  double duration_ms = 2;
  string error_message = 3;
}

/// <summary>
/// 通用行数据结构
/// </summary>
message Row {
  map<string, google.protobuf.Value> columns = 1;
}

// ═══════════════════════════════════════════════════════════════════════════
// DBVector 服务消息
// ═══════════════════════════════════════════════════════════════════════════

message VectorUpsertRequest {
  TransactionContext transaction_context = 1;
  string collection = 2;
  repeated float vector = 3;
  string id = 4;
  map<string, google.protobuf.Value> metadata = 5;
}

message VectorUpsertResponse {
  string id = 1;
  bool success = 2;
  string error_message = 3;
}

message VectorSearchRequest {
  TransactionContext transaction_context = 1;
  string collection = 2;
  repeated float vector = 3;
  int32 top_k = 4;
  map<string, string> filter = 5;
}

message VectorSearchResponse {
  repeated VectorSearchHit hits = 1;
  double duration_ms = 2;
  string error_message = 3;
}

message VectorSearchHit {
  string id = 1;
  float score = 2;
  map<string, google.protobuf.Value> metadata = 3;
}

message VectorDeleteRequest {
  TransactionContext transaction_context = 1;
  string collection = 2;
  string id = 3;
}

message VectorDeleteResponse {
  bool success = 1;
  string error_message = 2;
}

message VectorListCollectionsRequest {
  TransactionContext transaction_context = 1;
}

message VectorListCollectionsResponse {
  repeated string collections = 1;
  string error_message = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// DBBLOB 服务消息
// ═══════════════════════════════════════════════════════════════════════════

message BlobUploadRequest {
  TransactionContext transaction_context = 1;
  string key = 2;
  bytes data = 3;
  string content_type = 4;
  map<string, string> metadata = 5;
}

message BlobUploadResponse {
  string key = 1;
  int64 size = 2;
  string error_message = 3;
}

message BlobDownloadRequest {
  TransactionContext transaction_context = 1;
  string key = 2;
}

message BlobDownloadResponse {
  string key = 1;
  bytes data = 2;
  string content_type = 3;
  string error_message = 4;
}

message BlobDeleteRequest {
  TransactionContext transaction_context = 1;
  string key = 2;
}

message BlobDeleteResponse {
  bool success = 1;
  string error_message = 2;
}

message BlobListRequest {
  TransactionContext transaction_context = 1;
  string prefix = 2;
}

message BlobListResponse {
  repeated string keys = 1;
  string error_message = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// 枚举定义
// ═══════════════════════════════════════════════════════════════════════════

enum CommitStatus {
  COMMIT_STATUS_UNSPECIFIED = 0;
  COMMIT_STATUS_COMMITTED = 1;     // 全部成功
  COMMIT_STATUS_PARTIAL = 2;       // 部分成功（重试耗尽后）
  COMMIT_STATUS_ROLLED_BACK = 3;   // 已回滚
  COMMIT_STATUS_TIMEOUT = 4;       // 超时
}

enum TransactionState {
  TRANSACTION_STATE_UNSPECIFIED = 0;
  TRANSACTION_STATE_ACTIVE = 1;
  TRANSACTION_STATE_COMMITTED = 2;
  TRANSACTION_STATE_ROLLED_BACK = 3;
  TRANSACTION_STATE_IN_DOUBT = 4;
}
